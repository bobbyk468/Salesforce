name: Submit changed URLs to IndexNow

# Production deploys come from pushes to Summer26 (Cloudflare Workers Builds).
# Only URLs whose page content changed are submitted, after the deploy is live.
on:
  push:
    branches:
      - Summer26
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = whole sitemap, diff = files changed in the last commit'
        type: choice
        options: [full, diff]
        default: full

permissions:
  contents: read
  checks: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  indexnow:
    name: Ping IndexNow
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so a push of several commits can diff against github.event.before.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Map changed files to URLs
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.mode }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DISPATCH_MODE" = "full" ]; then
            echo "Manual run: submitting the full sitemap."
            { echo "should_submit=true"; echo "mode=full"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="HEAD~1"
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          fi
          node scripts/indexnow-changed-urls.mjs --base "$BASE" --head HEAD --out /tmp/changed-urls.txt

      - name: Wait for Cloudflare Workers deploy
        if: steps.changes.outputs.should_submit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CHECK_PREFIX: 'Workers Builds:'
        run: |
          deadline=$(( $(date +%s) + 15 * 60 ))
          while :; do
            run=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name | startswith(\"$CHECK_PREFIX\"))] | sort_by(.started_at) | last // empty | \"\(.status) \(.conclusion // \"-\") \(.name)\"" || echo "")
            if [ -z "$run" ]; then
              echo "$(date -u +%T) waiting: no Workers Builds check run yet"
            else
              read -r status conclusion name <<< "$run"
              echo "$(date -u +%T) $name: $status ($conclusion)"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "Deploy finished."
                  exit 0
                fi
                echo "::error::Cloudflare Workers build ended with '$conclusion'; not submitting to IndexNow."
                exit 1
              fi
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after 15 minutes waiting for the Cloudflare Workers build; not submitting."
              exit 1
            fi
            sleep 25
          done

      - name: Submit to IndexNow
        if: steps.changes.outputs.should_submit == 'true'
        env:
          MODE: ${{ steps.changes.outputs.mode }}
        run: |
          if [ "$MODE" = "full" ]; then
            npm run indexnow
          else
            npm run indexnow -- --file /tmp/changed-urls.txt
          fi

      - name: Nothing to submit
        if: steps.changes.outputs.should_submit != 'true'
        run: echo "Only non-page files changed; skipped the deploy wait and IndexNow."
