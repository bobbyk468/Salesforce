name: X Queue Posting

on:
  schedule:
    # Post due queue items regularly.
    - cron: "*/15 * * * *"
    # Check engagement replies hourly.
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options:
          - schedule
          - engage
          - both
        default: both
      dry_run:
        description: "Run without posting"
        type: boolean
        default: false

concurrency:
  group: x-posting
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Run scheduler (cron)
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *' }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npm run x:schedule

      - name: Run engage (cron)
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '15 * * * *' }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npm run x:engage

      - name: Run scheduler (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'schedule' || inputs.mode == 'both') }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npm run x:schedule ${{ inputs.dry_run && '-- --dry-run' || '' }}

      - name: Run engage (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'engage' || inputs.mode == 'both') }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npm run x:engage ${{ inputs.dry_run && '-- --dry-run' || '' }}
