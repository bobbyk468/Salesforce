name: X Queue Posting

on:
  schedule:
    # Post due queue items regularly.
    - cron: "*/15 * * * *"
    # Check engagement replies hourly.
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options:
          - schedule
          - engage
          - both
        default: both
      dry_run:
        description: "Run without posting"
        type: boolean
        default: false

# cancel-in-progress: true would abort a run mid-thread and risks duplicate roots — keep false so queued runs wait.
concurrency:
  group: x-posting
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      # Needed to push queue JSON after posting so the next run does not re-post the same item.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Run scheduler (cron)
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *' }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_SCHEDULE_MAX_DUE: "1"
        run: npm run x:schedule

      - name: Run engage (cron)
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '15 * * * *' }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npm run x:engage

      - name: Run scheduler (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'schedule' || inputs.mode == 'both') }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_SCHEDULE_MAX_DUE: "1"
        run: npm run x:schedule ${{ inputs.dry_run && '-- --dry-run' || '' }}

      - name: Run engage (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'engage' || inputs.mode == 'both') }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npm run x:engage ${{ inputs.dry_run && '-- --dry-run' || '' }}

      # Without this, the queue file on GitHub never gets status=posted — every run would see the same pending item and post duplicates.
      # Use always() (not success()) so a mid-thread API failure still pushes postCheckpoint — otherwise the next run re-posts tweet 1.
      - name: Commit and push queue updates
        if: ${{ always() && !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/x-content-queue.json scripts/x-tips-queue.json
          if git diff --staged --quiet; then
            echo "No queue changes to commit."
          else
            git commit -m "chore(x): sync queue after automated post [skip ci]"
            ok=0
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && ok=1 && break
              echo "Push failed (attempt $attempt), retrying..."
              sleep 8
            done
            if [ "$ok" != 1 ]; then
              echo "::error::git push failed after 3 attempts — queue updates may not be on GitHub."
              exit 1
            fi
          fi
