<svg viewBox="0 0 1200 1500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="1500" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="600" y="80" font-size="48" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Access Control Hierarchy
  </text>

  <!-- Layer 3: Permission Sets (Top) -->
  <g id="layer3">
    <polygon points="600,250 450,350 750,350" fill="#4ade80" stroke="#22c55e" stroke-width="3"/>
    <text x="600" y="310" font-size="32" font-weight="bold" text-anchor="middle" fill="white">
      Permission Sets
    </text>
    <text x="600" y="360" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="500">
      (Layer 3 - Can Only ADD Access)
    </text>
  </g>

  <!-- Arrow down -->
  <line x1="600" y1="370" x2="600" y2="420" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Layer 2: Sharing Rules (Middle) -->
  <g id="layer2">
    <polygon points="600,500 350,600 850,600" fill="#facc15" stroke="#eab308" stroke-width="3"/>
    <text x="600" y="560" font-size="32" font-weight="bold" text-anchor="middle" fill="white">
      Sharing Rules & Role Hierarchy
    </text>
    <text x="600" y="615" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="500">
      (Layer 2 - Manual Exceptions)
    </text>
  </g>

  <!-- Arrow down -->
  <line x1="600" y1="620" x2="600" y2="670" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Layer 1: OWD (Bottom - Largest) -->
  <g id="layer1">
    <polygon points="600,850 100,950 1100,950" fill="#ef4444" stroke="#dc2626" stroke-width="3"/>
    <text x="600" y="890" font-size="40" font-weight="bold" text-anchor="middle" fill="white">
      OWD: Organization-Wide Defaults
    </text>
    <text x="600" y="945" font-size="24" text-anchor="middle" fill="white" font-weight="500">
      (Layer 1 - THE FLOOR - Most Restrictive)
    </text>
  </g>

  <!-- Key Rule Box -->
  <rect x="150" y="1050" width="900" height="150" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="10"/>
  <text x="600" y="1100" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    🔑 KEY RULE: Permission Sets CANNOT Override OWD
  </text>
  <text x="600" y="1145" font-size="22" text-anchor="middle" fill="#1a1a1a">
    OWD is the LAW. Permission Sets are EXCEPTIONS.
  </text>
  <text x="600" y="1190" font-size="22" text-anchor="middle" fill="#1a1a1a">
    Exceptions cannot override the law.
  </text>

  <!-- Flow indicators -->
  <text x="150" y="1350" font-size="20" fill="#666">
    Most Restrictive ↑
  </text>
  <text x="950" y="1350" font-size="20" fill="#666" text-anchor="end">
    ↓ Least Restrictive
  </text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>
