<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="600" y="50" font-size="40" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Permission Sets Can't Override OWD
  </text>

  <!-- Left Side: WRONG -->
  <g id="wrong-section">
    <!-- Red background -->
    <rect x="50" y="100" width="500" height="480" fill="#fee2e2" stroke="#dc2626" stroke-width="3" rx="10"/>

    <!-- Red X -->
    <text x="150" y="200" font-size="80" text-anchor="middle" fill="#dc2626">❌</text>

    <!-- Text -->
    <text x="300" y="220" font-size="28" font-weight="bold" text-anchor="middle" fill="#991b1b">
      WRONG APPROACH
    </text>
    <text x="300" y="280" font-size="24" text-anchor="middle" fill="#1a1a1a" font-weight="bold">
      Create Permission Set:
    </text>
    <text x="300" y="320" font-size="22" text-anchor="middle" fill="#1a1a1a">
      "Read All Cases"
    </text>
    <text x="300" y="380" font-size="20" text-anchor="middle" fill="#991b1b" font-weight="bold">
      IF OWD = Private
    </text>
    <text x="300" y="420" font-size="20" text-anchor="middle" fill="#991b1b" font-weight="bold">
      Result: BLOCKED ❌
    </text>
    <text x="300" y="470" font-size="18" text-anchor="middle" fill="#666" font-style="italic">
      Permission Set can't override OWD
    </text>
  </g>

  <!-- Right Side: RIGHT -->
  <g id="right-section">
    <!-- Green background -->
    <rect x="650" y="100" width="500" height="480" fill="#dcfce7" stroke="#16a34a" stroke-width="3" rx="10"/>

    <!-- Green checkmark -->
    <text x="900" y="200" font-size="80" text-anchor="middle" fill="#16a34a">✅</text>

    <!-- Text -->
    <text x="900" y="220" font-size="28" font-weight="bold" text-anchor="middle" fill="#166534">
      RIGHT APPROACH
    </text>
    <text x="900" y="280" font-size="24" text-anchor="middle" fill="#1a1a1a" font-weight="bold">
      Create Sharing Rule:
    </text>
    <text x="900" y="320" font-size="22" text-anchor="middle" fill="#1a1a1a">
      "Sales Reps Read All Cases"
    </text>
    <text x="900" y="380" font-size="20" text-anchor="middle" fill="#166534" font-weight="bold">
      IF OWD = Private
    </text>
    <text x="900" y="420" font-size="20" text-anchor="middle" fill="#166534" font-weight="bold">
      Result: ACCESS ✅
    </text>
    <text x="900" y="470" font-size="18" text-anchor="middle" fill="#666" font-style="italic">
      Sharing rules OVERRIDE OWD
    </text>
  </g>

  <!-- Center separator line -->
  <line x1="600" y1="100" x2="600" y2="580" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Bottom rule -->
  <rect x="50" y="600" width="1100" height="20" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
</svg>
